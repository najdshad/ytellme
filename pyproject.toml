[project]
name = "content-factory"
version = "0.1.0"
description = "Topic -> narrated stick-figure explainer video, via LLM agents + piper TTS + ComfyUI + ffmpeg"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.19",
    "piper-tts>=1.8",
]

[project.scripts]
cf = "cf.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cf"]